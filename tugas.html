<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitung Luas & Keliling Persegi Panjang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f0f4fd 0%, #e2eafc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #1e293b;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 18px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            padding: 32px;
            border: 1px solid #e2e8f0;
        }

        .card h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            text-align: center;
            margin-bottom: 6px;
        }

        .card p.subtitle {
            font-size: 0.9rem;
            color: #64748b;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #0f172a;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .btn-hitung {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 13px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 8px;
            margin-bottom: 24px;
        }

        .btn-hitung:hover {
            background-color: #1d4ed8;
        }

        .btn-hitung:active {
            transform: scale(0.99);
        }

        .result-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 20px;
        }

        .result-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 12px;
            text-align: center;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .result-item {
            background: #ffffff;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #edf2f7;
            text-align: center;
        }

        .result-item.highlight {
            background: #eff6ff;
            border-color: #bfdbfe;
        }

        .result-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .result-value {
            font-size: 1.15rem;
            font-weight: 700;
            color: #1e293b;
        }

        .result-item.highlight .result-value {
            color: #1d4ed8;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Persegi Panjang</h1>
        <p class="subtitle">Hitung Luas dan Keliling dengan Cepat</p>

        <div class="form-group">
            <label for="inputPanjang">Panjang (m)</label>
            <input type="number" id="inputPanjang" placeholder="Masukkan nilai panjang" value="100" min="0" step="any">
        </div>

        <div class="form-group">
            <label for="inputLebar">Lebar (m)</label>
            <input type="number" id="inputLebar" placeholder="Masukkan nilai lebar" value="50" min="0" step="any">
        </div>

        <button type="button" class="btn-hitung" id="btnHitung" onclick="hitung()">Hitung</button>

        <div class="result-box">
            <div class="result-title">Hasil Perhitungan</div>
            <div class="result-grid">
                <div class="result-item">
                    <div class="result-label">Panjang</div>
                    <div class="result-value"><span id="panjang">100</span> m</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Lebar</div>
                    <div class="result-value"><span id="lebar">50</span> m</div>
                </div>
                <div class="result-item highlight">
                    <div class="result-label">Luas</div>
                    <div class="result-value"><span id="luas">5000</span> m<sup>2</sup></div>
                </div>
                <div class="result-item highlight">
                    <div class="result-label">Keliling</div>
                    <div class="result-value"><span id="keliling">300</span> m</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function hitung() {
            // Mengambil nilai input dari pengguna dan mengubahnya menjadi number
            let panjang = parseFloat(document.getElementById("inputPanjang").value);
            let lebar = parseFloat(document.getElementById("inputLebar").value);

            // Validasi input jika kosong atau bukan angka
            if (isNaN(panjang) || isNaN(lebar)) {
                alert("Silakan masukkan nilai panjang dan lebar yang valid!");
                return;
            }

            // Rumus Luas = panjang * lebar
            let luas = panjang * lebar;

            // Rumus Keliling = 2 * (panjang + lebar)
            let keliling = 2 * (panjang + lebar);

            // Menampilkan hasil perhitungan ke elemen HTML
            document.getElementById("panjang").textContent = panjang;
            document.getElementById("lebar").textContent = lebar;
            document.getElementById("luas").textContent = luas;
            document.getElementById("keliling").textContent = keliling;
        }

        // Jalankan fungsi hitung sekali saat halaman pertama kali dimuat
        hitung();
    </script>
</body>

</html>
